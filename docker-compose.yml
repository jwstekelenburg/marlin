services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marlin
      POSTGRES_PASSWORD: marlin
      POSTGRES_DB: marlin
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marlin -d marlin"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    command: ["node", "--import", "tsx", "packages/db/src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://marlin:marlin@postgres:5432/marlin
      MAX_SUBDOMAINS_PER_APEX: ${MAX_SUBDOMAINS_PER_APEX:-100}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    command: ["node", "--import", "tsx", "apps/api/src/index.ts"]
    environment:
      DATABASE_URL: postgres://marlin:marlin@postgres:5432/marlin
      API_PORT: 3000
      API_HOST: "0.0.0.0"
      CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "3001:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - api

  fetcher:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    command: ["node", "--import", "tsx", "apps/fetcher/src/index.ts"]
    environment:
      DATABASE_URL: postgres://marlin:marlin@postgres:5432/marlin
      FETCH_CONCURRENCY: ${FETCH_CONCURRENCY:-16}
      FETCH_POLL_MS: ${FETCH_POLL_MS:-500}
      FETCH_MAX_READY: ${FETCH_MAX_READY:-500}
      FETCH_TIMEOUT_MS: ${FETCH_TIMEOUT_MS:-15000}
      FETCH_MAX_BYTES: ${FETCH_MAX_BYTES:-1000000}
      FETCH_DELAY_MS: ${FETCH_DELAY_MS:-200}
      FETCH_USER_AGENT: ${FETCH_USER_AGENT:-MarlinPersonalIndex/0.1}
      MAX_SUBDOMAINS_PER_APEX: ${MAX_SUBDOMAINS_PER_APEX:-100}
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    command: ["node", "--import", "tsx", "apps/worker/src/index.ts"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://marlin:marlin@postgres:5432/marlin
      WORKER_PROFILE: ${DOCKER_WORKER_PROFILE:-docker-g4-4b}
      CATALOG_POLICY: ${CATALOG_POLICY:-v1-simple}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-200}
      MAX_SUBDOMAINS_PER_APEX: ${MAX_SUBDOMAINS_PER_APEX:-100}
    depends_on:
      migrate:
        condition: service_completed_successfully

  steward:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    command: ["node", "--import", "tsx", "apps/steward/src/index.ts"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://marlin:marlin@postgres:5432/marlin
      WORKER_PROFILE: ${DOCKER_WORKER_PROFILE:-docker-g4-4b}
      STEWARD_POLICY: ${STEWARD_POLICY:-v1-simple}
      STEWARD_POLL_MS: ${STEWARD_POLL_MS:-60000}
      STEWARD_BATCH: ${STEWARD_BATCH:-10}
      MAX_SUBDOMAINS_PER_APEX: ${MAX_SUBDOMAINS_PER_APEX:-100}
    depends_on:
      migrate:
        condition: service_completed_successfully

  spider:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    command: ["node", "--import", "tsx", "apps/spider/src/index.ts"]
    environment:
      DATABASE_URL: postgres://marlin:marlin@postgres:5432/marlin
      SPIDER_SEEDS: ${SPIDER_SEEDS:-https://example.com}
      SPIDER_MAX_DEPTH: ${SPIDER_MAX_DEPTH:-1}
      SPIDER_MAX_HOSTS: ${SPIDER_MAX_HOSTS:-50}
      SPIDER_CONCURRENCY: ${SPIDER_CONCURRENCY:-4}
      SPIDER_DELAY_MS: ${SPIDER_DELAY_MS:-500}
      SPIDER_FROM_QUEUE: ${SPIDER_FROM_QUEUE:-false}
      FETCH_TIMEOUT_MS: ${FETCH_TIMEOUT_MS:-15000}
      FETCH_USER_AGENT: ${FETCH_USER_AGENT:-MarlinPersonalIndex/0.1}
      MAX_SUBDOMAINS_PER_APEX: ${MAX_SUBDOMAINS_PER_APEX:-100}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.0.0/24
