# Dev overlay: `docker compose -f docker-compose.yml -f docker-compose.dev.yml up`
# starts only Postgres + migrate. Run api/web/worker/spider on the host.
services:
  api:
    profiles: ["docker-apps"]
  web:
    profiles: ["docker-apps"]
  fetcher:
    profiles: ["tools"]
  worker:
    profiles: ["tools"]
  spider:
    profiles: ["tools"]
