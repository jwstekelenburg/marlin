# Dev overlay: hide api/web so `up` is Postgres (+ migrate) only.
# Prefer: npm run docker:db
# Full stack on Docker: npm run docker:up
services:
  api:
    profiles: ["docker-apps"]
  web:
    profiles: ["docker-apps"]
  fetcher:
    profiles: ["tools"]
  worker:
    profiles: ["tools"]
  spider:
    profiles: ["tools"]
